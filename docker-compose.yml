services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    entrypoint: ["/bin/bash", "/scripts/init_kafka_topics.sh"]
    volumes:
      - ./scripts/init_kafka_topics.sh:/scripts/init_kafka_topics.sh:ro

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-searchmetrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searchmetrics}
      POSTGRES_DB: ${POSTGRES_DB:-search_metrics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-searchmetrics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["alembic", "-c", "/app/db/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://searchmetrics:searchmetrics@postgres:5432/search_metrics}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    depends_on:
      - spark-master
      - kafka-init
      - db-migrate

  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.1
      - /app/spark_streaming.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: raw-search-events
      KAFKA_ANOMALIES_TOPIC: anomaly-alerts
      DATABASE_URL: ${DATABASE_URL:-postgresql://searchmetrics:searchmetrics@postgres:5432/search_metrics}
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints
    depends_on:
      - spark-worker
      - kafka-init
      - db-migrate
    restart: on-failure

  raw-event-writer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    command: ["python", "raw_event_writer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: raw-search-events
      DATABASE_URL: ${DATABASE_URL:-postgresql://searchmetrics:searchmetrics@postgres:5432/search_metrics}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: raw-search-events
      EVENTS_PER_MINUTE: ${EVENTS_PER_MINUTE:-1000}
      SERVICE_IDS: ${SERVICE_IDS:-search-api,recommendations,indexer,ranking}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://searchmetrics:searchmetrics@postgres:5432/search_metrics}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
